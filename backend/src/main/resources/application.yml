spring:
  application:
    name: paysphere
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/paysphere}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa: 
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-must-be-at-least-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@paysphere.com}
    password: ${ADMIN_PASSWORD:Admin@123}
  seed-demo-users: ${SEED_DEMO_USERS:true}